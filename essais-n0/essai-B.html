<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistant Friperie &amp; Ressourcerie</title>
<style>
  :root {
    --vert: #3e7d5a;
    --vert-clair: #e8f3ed;
    --beige: #faf6ef;
    --texte: #2b2b26;
    --gris: #6f6f66;
    --bulle-bot: #ffffff;
    --bulle-user: #3e7d5a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--beige);
    color: var(--texte);
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    border-left: 1px solid #e5e0d5;
    border-right: 1px solid #e5e0d5;
  }
  header {
    background: var(--vert);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header .logo {
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; color: var(--vert);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  header p { font-size: .78rem; opacity: .85; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: .92rem;
    line-height: 1.45;
    animation: apparait .25s ease;
    white-space: pre-line;
  }
  @keyframes apparait { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .bot { background: var(--bulle-bot); align-self: flex-start; border: 1px solid #e5e0d5; border-bottom-left-radius: 4px; }
  .user { background: var(--bulle-user); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .horaire { border-collapse: collapse; margin-top: 6px; font-size: .85rem; }
  .horaire td { padding: 2px 10px 2px 0; }
  #suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 16px 10px;
  }
  #suggestions button {
    background: var(--vert-clair);
    color: var(--vert);
    border: 1px solid #bcd8c8;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: .82rem;
    cursor: pointer;
    font-family: inherit;
  }
  #suggestions button:hover { background: #d8ebdf; }
  footer {
    display: flex;
    gap: 10px;
    padding: 12px 16px 16px;
    background: #fff;
    border-top: 1px solid #e5e0d5;
  }
  #saisie {
    flex: 1;
    border: 1px solid #d8d2c4;
    border-radius: 999px;
    padding: 11px 16px;
    font-size: .92rem;
    font-family: inherit;
    outline: none;
  }
  #saisie:focus { border-color: var(--vert); }
  #envoyer {
    background: var(--vert);
    color: #fff;
    border: none;
    border-radius: 999px;
    width: 46px; height: 46px;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  #envoyer:hover { background: #33684b; }
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b9b9ae; animation: pulse 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>

<header>
  <div class="logo">♻️</div>
  <div>
    <h1>La Ressourcerie — Assistant</h1>
    <p>Réponse immédiate · dons · dépôt-vente · réductions</p>
  </div>
</header>

<div id="chat"></div>
<div id="suggestions"></div>

<footer>
  <input id="saisie" type="text" placeholder="Posez votre question…" autocomplete="off" />
  <button id="envoyer" title="Envoyer">➤</button>
</footer>

<script>
/* =========================================================
   1. PERSONNALISATION DE LA BOUTIQUE — modifiez ces valeurs
   ========================================================= */
const BOUTIQUE = {
  nom: "La Ressourcerie du Quartier",
  adresse: "12 rue des Tilleuls, 69003 Lyon",
  tel: "04 78 00 00 00",
  email: "contact@ressourcerie-exemple.fr",
  horaires: [
    ["Mardi – Vendredi", "10h00 – 18h30"],
    ["Samedi", "9h30 – 19h00"],
    ["Dimanche & Lundi", "Fermé"]
  ],
  depot: "Mercredi et samedi, 10h – 12h et 14h – 17h",
  taux: "Prix généralement entre 1 € et 15 €. Les dépôts en dépôt-vente sont répartis 50/50 entre le déposant et la boutique.",
  paiement: "Espèces et carte bancaire (sans contact accepté)."
};

/* =========================================================
   2. BASE DE CONNAISSANCES : intentions + réponses
   Chaque intention : mots-clés (regex) + réponse (ou fonction)
   ========================================================= */
const intentions = [
  {
    nom: "horaires",
    mots: /(horair|ouvert|ferm|heure|ouvre|heure)/i,
    reponse: () =>
      "🕒 Voici nos horaires d'ouverture :\n" +
      BOUTIQUE.horaires.map(h => "• " + h[0] + " : " + h[1]).join("\n")
  },
  {
    nom: "adresse",
    mots: /(adresse|où|localis|situation|trouver|itinéraire|plan)/i,
    reponse: () =>
      "📍 Nous sommes au " + BOUTIQUE.adresse + ".\n" +
      "N'hésitez pas à nous appeler au " + BOUTIQUE.tel + " si vous ne trouvez pas."
  },
  {
    nom: "contact",
    mots: /(t[eé]l[eé]phone|num[eé]ro|appeler|joindre|contact|email|mail|courriel)/i,
    reponse: () =>
      "📞 Téléphone : " + BOUTIQUE.tel + "\n" +
      "✉️ Email : " + BOUTIQUE.email + "\n" +
      "Vous pouvez aussi passer directement à la boutique."
  },
  {
    nom: "don",
    mots: /(don|donner|dons|d[eé]p[oô]s|apporter|d[eé]barras|encombrant)/i,
    reponse: () =>
      "💚 Merci de penser à nous ! Pour donner, deux options :\n" +
      "• Déposer directement en boutique aux heures de dépôt : " + BOUTIQUE.depot + "\n" +
      "• Nous contacter pour un rejet éventuel (volumineux) : " + BOUTIQUE.tel + "\n\n" +
      "Nous acceptons : vêtements propres et en bon état, livres, vaisselle, petits meubles, jouets, petit électroménager.\n" +
      "Nous n'acceptons pas : matelas, articles dégradés, produits dangereux, matériel non testé."
  },
  {
    nom: "depot-vente",
    mots: /(d[eé]p[oô]t.?vente|consign|vend( re|re mes)? (mes|des)|commissions?|r[eé]partition|part)/i,
    reponse: () =>
      "🤝 Dépôt-vente : vous déposez un objet, nous le vendons pour vous.\n" +
      BOUTIQUE.taux + "\n" +
      "Dépôts acceptés : " + BOUTIQUE.depot + "\n" +
      "Les invendus sont à récupérer sous 15 jours ou reversés en don."
  },
  {
    nom: "prix",
    mots: /(prix|tarif|co[uû]te|combien|cher|r[eé]duction|remise|promo)/i,
    reponse: () =>
      "🏷️ Nos prix sont très accessibles : " + BOUTIQUE.taux + "\n" +
      "Étiquette verte = -50 % la dernière semaine du mois !"
  },
  {
    nom: "paiement",
    mots: /(paiement|payer|carte|esp[eè]ces|cb|chèque|cash)/i,
    reponse: () => "💳 Moyens de paiement : " + BOUTIQUE.paiement
  },
  {
    nom: "vendre",
    mots: /(vendre|revendre|estimer|valeur)/i,
    reponse: () =>
      "Pour vendre vos objets, c'est le dépôt-vente qu'il vous faut !\n" +
      BOUTIQUE.taux + "\nApportez vos objets : " + BOUTIQUE.depot + "."
  },
  {
    nom: "textile",
    mots: /(vêtement|vetement|textile|fringue|habit|pantalon|robe|chaussure|taille|essayage)/i,
    reponse: () =>
      "👕 Côté textile : vêtements lavés et en bon état, triés par type et taille.\n" +
      "Cabines d'essayage disponibles. Reprise possible sous 7 jours avec le ticket."
  },
  {
    nom: "ressourcerie-generalites",
    mots: /(ressourcerie|friperie|qu'est.?ce que|c'est quoi|mission|but|objectif|environnement|d[eé]chets?)/i,
    reponse: () =>
      "♻️ Une ressourcerie (ou friperie pour le textile) récupère les objets dont vous ne voulez plus,\n" +
      "les valorise et les remet en vente à petit prix : moins de déchets, des achats responsables\n" +
      "et du soutien à l'emploi local. Acheter d'occasion, c'est donner une seconde vie !"
  },
  {
    nom: "benevolat",
    mots: /(b[eé]n[eé]vol|aide[rz]? |travailler|emploi|poste|stage)/i,
    reponse: () =>
      "🙌 Envie de nous aider ? Nous recrutons régulièrement des bénévoles (tri, accueil, mise en rayon)\n" +
      "et parfois des salariés en insertion. Parlez-en à l'accueil ou appelez le " + BOUTIQUE.tel + "."
  },
  {
    nom: "retour",
    mots: /(retour|reprise|rembours|échang|echang|ticket)/i,
    reponse: () =>
      "↩️ Reprise possible sous 7 jours, avec le ticket, article non porté/non utilisé.\n" +
      "Remboursement en avoir sur la boutique."
  },
  {
    nom: "carte-fidelite",
    mots: /(fid[eé]lit|carte de membre|adh[eé]sion)/i,
    reponse: () =>
      "⭐ Carte fidélité gratuite : au bout de 10 achats, le 11e avec -30 %.\n" +
      "Demandez-la à l'accueil !"
  },
  {
    nom: "salutations",
    mots: /^(bonjour|salut|bonsoir|coucou|hello|hey|yo)\b| ça va|comment [ac]a va/i,
    reponse: () =>
      "Bonjour et bienvenue chez " + BOUTIQUE.nom + " ! 👋\n" +
      "Je peux vous renseigner sur : les horaires, les dons, le dépôt-vente, les prix, la reprise des articles…"
  },
  {
    nom: "remerciements",
    mots: /(merci|nickel|super|parfait|g[eé]nial|top)\b/i,
    reponse: () => "Avec plaisir ! 💚 N'hésitez pas si vous avez d'autres questions. Belle journée !"
  },
  {
    nom: "au-revoir",
    mots: /(au revoir|bye|bonne journ[eé]e|ciao|à \+|adieu)/i,
    reponse: () => "Au revoir et à bientôt chez " + BOUTIQUE.nom + " ! ♻️"
  }
];

/* =========================================================
   3. MOTEUR DU CHATBOT
   ========================================================= */
const chat = document.getElementById("chat");
const saisie = document.getElementById("saisie");
const envoyer = document.getElementById("envoyer");
const zoneSugg = document.getElementById("suggestions");

const SUGGESTIONS = [
  "Quels sont vos horaires ?",
  "Comment donner des objets ?",
  "Comment fonctionne le dépôt-vente ?",
  "Quels sont vos prix ?",
  "Où êtes-vous situés ?",
  "Puis-je échanger un article ?"
];

function ajouter(texte, qui) {
  const div = document.createElement("div");
  div.className = "msg " + qui;
  // petites tables horaires bien rendues
  div.textContent = texte;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function afficherSuggestions() {
  zoneSugg.innerHTML = "";
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { envoyerMessage(s); };
    zoneSugg.appendChild(b);
  });
}

function trouverReponse(texte) {
  const t = texte.toLowerCase();
  let meilleur = null, meilleurScore = 0;
  for (const it of intentions) {
    const m = t.match(it.mots);
    if (m) {
      const score = (m[0] || "").length;
      if (score > meilleurScore) { meilleurScore = score; meilleur = it; }
    }
  }
  if (meilleur) return typeof meilleur.reponse === "function" ? meilleur.reponse() : meilleur.reponse;
  return "Hmm, je ne suis pas sûr d'avoir compris 😅\nVous pouvez essayer des questions comme :\n" +
    "• « Quels sont vos horaires ? »\n• « Comment donner des vêtements ? »\n• « Comment marche le dépôt-vente ? »\n" +
    "Ou appelez-nous au " + BOUTIQUE.tel + ".";
}

function envoyerMessage(texte) {
  if (!texte.trim()) return;
  ajouter(texte, "user");
  saisie.value = "";
  zoneSugg.innerHTML = "";
  // indicateur de frappe
  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
  setTimeout(() => {
    typing.remove();
    ajouter(trouverReponse(texte), "bot");
    afficherSuggestions();
  }, 550);
}

envoyer.onclick = () => envoyerMessage(saisie.value);
saisie.addEventListener("keydown", e => { if (e.key === "Enter") envoyerMessage(saisie.value); });

/* Message d'accueil */
ajouter(
  "Bonjour ! 👋 Je suis l'assistant de " + BOUTIQUE.nom + ".\n" +
  "Posez-moi vos questions sur nos horaires, les dons, le dépôt-vente, les prix…",
  "bot"
);
afficherSuggestions();
</script>
</body>
</html>
