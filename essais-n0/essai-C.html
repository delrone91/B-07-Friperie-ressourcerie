<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistant Friperie &amp; Ressourserie</title>
<style>
  :root {
    --vert: #2f7d4f;
    --vert-clair: #e7f3ea;
    --vert-fonce: #1d5b38;
    --beige: #faf6ef;
    --texte: #26302b;
    --bulle-client: #ffffff;
    --bulle-bot: var(--vert-clair);
    --bordure: #d8e2da;
    --ombre: 0 2px 10px rgba(38, 48, 43, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--beige);
    color: var(--texte);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--vert);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--ombre);
  }
  header .logo {
    width: 42px; height: 42px;
    background: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  header p { margin: 2px 0 0; font-size: .78rem; opacity: .85; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .message {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: .95rem;
    box-shadow: var(--ombre);
    white-space: pre-wrap;
    animation: apparait .25s ease;
  }
  @keyframes apparait { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bot {
    background: var(--bulle-bot);
    border: 1px solid var(--bordure);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
  }
  .client {
    background: var(--bulle-client);
    border: 1px solid var(--bordure);
    border-bottom-right-radius: 4px;
    align-self: flex-end;
  }
  .message .meta {
    display: block;
    font-size: .7rem;
    opacity: .6;
    margin-bottom: 3px;
  }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; max-width: 85%; }
  .suggestion {
    background: #fff;
    border: 1px solid var(--vert);
    color: var(--vert-fonce);
    border-radius: 20px;
    padding: 6px 13px;
    font-size: .82rem;
    cursor: pointer;
    transition: background .15s;
  }
  .suggestion:hover { background: var(--vert-clair); }
  #zone-saisie {
    display: flex;
    gap: 10px;
    padding: 12px 18px;
    background: #fff;
    border-top: 1px solid var(--bordure);
  }
  #zone-saisie form {
    display: flex; gap: 10px;
    width: 100%; max-width: 820px; margin: 0 auto;
  }
  #saisie {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--bordure);
    border-radius: 24px;
    font-size: .95rem;
    outline: none;
  }
  #saisie:focus { border-color: var(--vert); }
  #envoyer {
    background: var(--vert);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 22px;
    font-size: .95rem;
    cursor: pointer;
  }
  #envoyer:hover { background: var(--vert-fonce); }
  #saisie:focus { border-color: var(--vert); }
  footer { text-align: center; font-size: .72rem; opacity: .55; padding: 6px; }
</style>
</head>
<body>
  <header>
    <div class="logo">🧵</div>
    <div>
      <h1>Assistant Friperie &amp; Ressourserie</h1>
      <p>En ligne — réponses immédiates</p>
    </div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="zone-saisie">
    <form id="formulaire">
      <input id="saisie" type="text" placeholder="Posez votre question…" autocomplete="off" aria-label="Votre message" />
      <button id="envoyer" type="submit">Envoyer</button>
    </form>
  </div>
  <footer>Assistant automatique — pour un suivi personnalisé, contactez votre boutique.</footer>

<script>
(function () {
  "use strict";

  var chat = document.getElementById("chat");
  var formulaire = document.getElementById("formulaire");
  var saisie = document.getElementById("saisie");

  // ----- Base de connaissances : paires [mots-clés (regex) -> réponse] -----
  var CONNAISSANCES = [
    {
      motif: /(horaires?|heures?|ouvert|ouvre|ferme|fermeture)/i,
      reponse: "🕐 Nos horaires :\n• Lundi – Vendredi : 10h00 – 18h30\n• Samedi : 10h00 – 17h00\n• Dimanche : fermé\n\nPensez à vérifier les horaires exceptionnels (jours fériés, inventaires) auprès de votre boutique."
    },
    {
      motif: /(dép[ôo]t|donner|don|apporter|vend?re? mes (vêtements|affaires)|consign)/i,
      reponse: "📦 Pour déposer des vêtements ou objets :\n1. Vérifiez que les articles sont propres et en bon état.\n2. Apportez-les en boutique pendant les heures de dépôt (souvent 10h–16h).\n3. Nos équipes trient les articles sous 48h.\n4. Selon le principe de consignation, vous recevez une partie du prix de vente une fois l'article vendu.\n\nAstuce : pliez vos vêtements et rangez-les dans un sac propre pour accélérer le tri !"
    },
    {
      motif: /(prix|tarif|combien|co[ûu]te|cher|remise|r[ée]duction|solde)/i,
      reponse: "💰 Nos prix sont généralement 3 à 10 fois inférieurs au neuf — et négociés dans la bonne humeur lors de nos journées spéciales !\n\n• Vêtements : souvent 2 € à 20 €\n• Meubles et objets : selon l'état et la rareté\n• Cartes de fidélité et ventes privées : renseignez-vous en boutique."
    },
    {
      motif: /(retour|[ée]change|rembours|garantie)/i,
      reponse: "↩️ Retours et échanges :\n• Échange ou avoir possible sous 14 jours avec le ticket de caisse.\n• Les articles non portés/utilisés, étiquette d'origine attachée.\n• Pas de remboursement en espèces, mais un avoir est toujours envisageable.\n\nEn cas de défaut non signalé, on s'arrange toujours — parlez-en à l'équipe !"
    },
    {
      motif: /(ressource[r]?ie|d[ée]chetterie|recycl|tri|encombrant|jeter)/i,
      reponse: "♻️ La ressourserie, c'est l'atelier anti-gaspi :\n• On récupère meubles, vaisselle, livres, jouets, petit électroménager...\n• Tout est testé, nettoyé, réparé puis remis en vente à prix solidaire.\n• Ce qui n'est pas vendable est recyclé dans les filières appropriées.\n\nAvant de jeter : demandez-nous ! Beaucoup d'objets ont une seconde vie."
    },
    {
      motif: /(friperie|vêtement|textile|taille|pointure|essayage)/i,
      reponse: "👕 Côté friperie :\n• Des vêtements triés, propres, pour toute la famille (bébé, enfant, adulte).\n• Essayage possible en cabine.\n• Nouveaux dépôts chaque semaine — les perles partent vite !\n• Besoin d'une taille précise ? Demandez à l'équipe, il y a souvent des réserves."
    },
    {
      motif: /(b[ée]n[ée]volat|membre|adh[ée]rer|adh[ée]sion|carte)/i,
      reponse: "🤝 Envie de rejoindre l'aventure ?\n• Bénévolat : accueil, tri, mise en rayon, ateliers couture ou réparation — selon vos envies et disponibilités.\n• Adhésion solidaire : soutien la structure et donne souvent accès à des remises.\n\nPassez nous voir ou laissez vos coordonnées en boutique, on vous rappelle !"
    },
    {
      motif: /(atelier|couture|r[ée]paration|repair|r[ée]pare|coudre)/i,
      reponse: "🪡 Ateliers et réparations :\n• Ateliers couture et upcycling : apprenez à réparer ou transformer vos vêtements.\n• Café réparation : apportez vos petits objets cassés, on diagnostique ensemble.\n• Consultez le planning en boutique ou sur nos affiches — places limitées, inscription conseillée."
    },
    {
      motif: /(adresse|localis|situer|trouver|o[ùu] [ée]tes[- ]vous)/i,
      reponse: "📍 Nous sommes au cœur du quartier — l'adresse exacte et l'itinéraire sont indiqués sur la vitrine de votre boutique et sur ses réseaux sociaux. N'hésitez pas à nous demander une indication précise !"
    },
    {
      motif: /(paiement|carte|esp[èe]ce|lyf|virement|cash)/i,
      reponse: "💳 Moyens de paiement acceptés :\n• Espèces\n• Carte bancaire (à partir de petits montants selon les boutiques)\n• Chèques d'association parfois acceptés\n\nLes tickets de caisse sont utiles pour les échanges — gardez-les !"
    },
    {
      motif: /(propre|laver|hygi[ée]ne|lav[ée]|nettoy)/i,
      reponse: "🫧 L'hygiène est une priorité :\n• Tous les vêtements déposés sont contrôlés, puis lavés ou vaporisés selon le textile.\n• Les objets sont nettoyés et testés avant mise en vente.\n• En boutique, un espace de désinfection est parfois disponible.\n\nSi un article vous semble douteux, signalez-le : on le retire du rayon."
    }
  ];

  var FALLBACK = [
    "Hmm, je n'ai pas saisi votre question 😅. Essayez des mots comme « horaires », « dépôt », « prix », « retour », « atelier » ou « bénévolat ».",
    "Je ne connais pas encore ce sujet ! Posez-moi une question sur la boutique : dépôts, horaires, prix, retours, ateliers…",
    "Je sèche ! Pour une demande précise, le mieux reste de contacter directement l'équipe en boutique. Sinon, essayez : « Comment déposer mes vêtements ? »"
  ];

  var BONJOUR = /(bonjour|salut|bonsoir|hello|coucou|hey|yo)/i;
  var MERCI = /(merci|nickel|super|parfait|top|g[ée]nial)/i;
  var AU_REVOIR = /(au revoir|bye|à bient[ôo]t|bonne journ[ée]e|ciao)/i;

  // ----- Utilitaires d'affichage -----
  function ajouterMessage(texte, classe) {
    var div = document.createElement("div");
    div.className = "message " + classe;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = classe === "bot" ? "🧵 Assistant · " : "Vous · ";
    meta.textContent += new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    var corps = document.createElement("span");
    corps.textContent = texte;
    div.appendChild(meta);
    div.appendChild(corps);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function ajouterSuggestions(textes) {
    var zone = document.createElement("div");
    zone.className = "suggestions";
    textes.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "suggestion";
      b.textContent = t;
      b.addEventListener("click", function () { traiter(t); });
      zone.appendChild(b);
    });
    chat.appendChild(zone);
    chat.scrollTop = chat.scrollHeight;
  }

  // ----- Moteur de réponses -----
  function trouverReponse(question) {
    if (BONJOUR.test(question) && question.length < 25) {
      return "Bonjour et bienvenue ! 👋 Je suis l'assistant de votre friperie-ressourserie. Que souhaitez-vous savoir ?";
    }
    if (MERCI.test(question) && question.length < 25) {
      return "Avec plaisir ! 🌱 N'hésitez pas si vous avez d'autres questions.";
    }
    if (AU_REVOIR.test(question)) {
      return "Merci de votre visite et à bientôt en boutique ! 👋 Chaque achat d'occasion, c'est un geste pour la planète 💚";
    }
    for (var i = 0; i < CONNAISSANCES.length; i++) {
      if (CONNAISSANCES[i].motif.test(question)) return CONNAISSANCES[i].reponse;
    }
    return FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
  }

  function traiter(texte) {
    ajouterMessage(texte, "client");
    saisie.value = "";
    // petit délai "réflexion"
    setTimeout(function () {
      ajouterMessage(trouverReponse(texte), "bot");
      if (/d[ée]p[ôo]t|horaires/i.test(texte)) {
        ajouterSuggestions(["Quels moyens de paiement ?", "Puis-je échanger un article ?", "Comment devenir bénévole ?"]);
      }
    }, 450);
  }

  formulaire.addEventListener("submit", function (e) {
    e.preventDefault();
    var texte = saisie.value.trim();
    if (texte) traiter(texte);
  });

  // ----- Message d'accueil -----
  ajouterMessage(
    "Bonjour ! 👋 Bienvenue chez votre friperie-ressourserie solidaire.\nJe peux vous renseigner sur :\n• 🕐 Les horaires et l'adresse\n• 📦 Les dépôts et la consignation\n• 💰 Les prix et les paiements\n• ↩️ Les retours et échanges\n• ♻️ Le recyclage et la ressourserie\n• 🪡 Les ateliers couture et réparation\n\nPosez votre question ou cliquez sur une suggestion ci-dessous !",
    "bot"
  );
  ajouterSuggestions([
    "Quels sont vos horaires ?",
    "Comment déposer mes vêtements ?",
    "Quels sont vos prix ?",
    "Comment devenir bénévole ?"
  ]);
})();
</script>
</body>
</html>
